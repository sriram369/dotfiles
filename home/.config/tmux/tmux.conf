# Kun Chen's tmux configuration.
#
# PROVENANCE: transcribed frame-by-frame from "L8 Principal's Agentic
# Engineering Workflow" (youtu.be/iQyg-KypKAA) at 6:52-7:10, where it is shown
# in Neovim as `programs.tmux` inside common.nix of his then-public
# `dotfiles-public` repo. That repo was replaced on 2026-07-05 by
# github.com/kunchenguid/dotfiles, whose initial commit omits tmux entirely,
# so this config exists nowhere else in public.
#
# Lines marked [V] are verbatim from the video.
# Lines marked [R] were truncated at his Neovim pane edge and are reconstructed
#   from standard tmux idiom. They are the only non-verbatim content here.
#
# The Nix `programs.tmux` option block is expanded to raw tmux below.

# ---- programs.tmux options (expanded from Nix) ---------------------------
set  -g base-index 1                      # [V] baseIndex = 1
setw -g pane-base-index 1                 # [V] baseIndex = 1 (panes follow)
set  -g renumber-windows on               # [V]
set  -g clock-mode-style 24               # [V] clock24 = true
set  -g focus-events on                   # [V] focusEvents = true
set  -g mode-keys vi                      # [V] keyMode = "vi"
set  -g status-keys vi                    # [V] keyMode = "vi"
set  -g mouse on                          # [V] mouse = true
set  -g default-terminal "screen-256color" # [V] terminal = "screen-256color"

# NOTE: no `prefix` is ever set in his config, so the tmux default C-b stands.

# ---- extraConfig ---------------------------------------------------------
set -g escape-time 10                     # [V]
set -g extended-keys on                   # [V]
set -g extended-keys-format csi-u         # [V]
set -g status-position top                # [V]
set -g pane-border-lines heavy            # [V]

# Let the rose-pine theme own pane colouring instead of tmux.
setw -gu window-style                     # [V]
setw -gu window-active-style              # [V]

# Pane navigation, vim keys, -r so they repeat without re-pressing the prefix.
bind-key -r h select-pane -L              # [V]
bind-key -r j select-pane -D              # [V]
bind-key -r k select-pane -U              # [V]
bind-key -r l select-pane -R              # [V]

# Splits and new windows inherit the current pane's directory.
bind-key '"' split-window -c "#{pane_current_path}"      # [V]
bind-key %   split-window -h -c "#{pane_current_path}"   # [V]
bind-key c   new-window -c "#{pane_current_path}"        # [V]
bind-key &   kill-window                                 # [V]

# Copy mode, vi-style.
bind-key y copy-mode                                                    # [V]
bind-key -T copy-mode-vi v     send-keys -X begin-selection             # [V]
bind-key -T copy-mode-vi y     send-keys -X copy-pipe-and-cancel "pbcopy"   # [R]
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"   # [R]
bind-key -T copy-mode-vi Escape send-keys -X cancel                     # [V]

# ---- theme: rose-pine moon, matching WezTerm and Neovim ------------------
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"      # [R]
set -g @rose_pine_variant 'moon'                                        # [V]

# Show the date/time only in the "main" session. The rose-pine date block
# hardcodes an icon/separator around it, so it cannot be made conditional
# cleanly; instead disable it and re-add it through the status-right
# prepend, wrapped in a session-name conditional.                       # [V comment, right edge inferred]
set -g @rose_pine_date_time ""                                          # [V]
set -g @rose_pine_status_right_prepend_section '#{?#{==:#{session_name},main}, %Y-%m-%d %H:%M ,}'  # [R]
set -g @rose_pine_directory 'on'                                        # [V]
set -g @rose_pine_bar_bg_disable 'on'                                   # [V]
set -g @rose_pine_bar_bg_disabled_color_option 'default'                # [V]
set -g @rose_pine_disable_active_window_menu 'on'                       # [V]
set -g @rose_pine_show_current_program 'on'                             # [V]

# ---- plugins -------------------------------------------------------------
set -g @plugin 'rose-pine/tmux'                   # [V]
set -g @plugin 'tmux-plugins/tmux-resurrect'      # [V]
set -g @plugin 'tmux-plugins/tmux-continuum'      # [V]
set -g @resurrect-capture-pane-contents 'on'      # [V]
set -g @continuum-restore 'on'                    # [V]
set -g @continuum-save-interval '15'              # [V]

# ---- load plugins, THEN override their status bar ------------------------
# Order matters and is his, not the usual "TPM goes last" advice: in the video
# run-shell sits above the status lines below, so these overrides win over
# whatever rose-pine sets. Moving TPM last silently hands the status bar back
# to the theme and `status` reverts from 2 to on.
run-shell "$HOME/.tmux/plugins/tpm/tpm"                                 # [V]

set  -g status-left ""                                                  # [V]
setw -g window-status-format "#[fg=#908caa,bg=default] #I #W "          # [R]
setw -g window-status-current-format "#[fg=#232136,bg=#c4a7e7,bold] #I #W " # [R]
setw -g window-status-separator " "                                     # [V]
set  -g status 2                                                        # [V]
set  -g status-format[1] "#[fg=#393552,bg=default]#[align=left] #{pane_current_path} " # [R]
