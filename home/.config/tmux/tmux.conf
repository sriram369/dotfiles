# Kun Chen's tmux configuration.
#
# PROVENANCE: transcribed frame-by-frame from "L8 Principal's Agentic
# Engineering Workflow" (youtu.be/iQyg-KypKAA) at 6:52-7:10, where it is shown
# in Neovim as `programs.tmux` inside common.nix of his then-public
# `dotfiles-public` repo. That repo was replaced on 2026-07-05 by
# github.com/kunchenguid/dotfiles, whose initial commit omits tmux entirely,
# so this config exists nowhere else in public.
#
#   [V] verbatim from the video.
#   [R] truncated at his Neovim pane edge, reconstructed from standard tmux
#       idiom. The only non-verbatim directives here.
#   [D] derived: emitted by home-manager's `programs.tmux` module, so present
#       in his live tmux without ever appearing in his source. Never on screen.
#
# The Nix option block is expanded to raw tmux below, because this machine does
# not run Nix.

# ---- [D] tmux-sensible, which home-manager prepends ----------------------
# `programs.tmux.sensibleOnTop` defaults to true, and the video frame at 6:53
# shows his complete option list (enable, baseIndex, clock24, focusEvents,
# keyMode, mouse, terminal, extraConfig) with no `sensibleOnTop`. So
# home-manager prepends `run-shell <tmuxPlugins.sensible.rtp>` ABOVE
# everything and his live tmux carries these. Reproduced inline and kept FIRST,
# so ordering still matches home-manager.
#
# Only the sensible settings that SURVIVE his own config are written out. The
# ones he supersedes - sensible's `escape-time 0` and `status-keys emacs`, plus
# `focus-events on` and `default-terminal`, both of which he re-states himself
# in the option block below - are omitted rather than written and then
# overwritten. Net runtime state is identical either way.
#
# Omitted deliberately: home-manager also emits `unbind C-b` / `set -g prefix
# C-b` / `bind C-b send-prefix`, which is a no-op at the default shortcut
# because tmux already binds `C-b send-prefix` itself.
set -g status-interval 5          # [D] tmux default is 15; the clock and path refresh 3x faster
set -g history-limit 50000        # [D] tmux default is 2000; also governs what resurrect saves
set -g display-time 4000          # [D]
setw -g aggressive-resize on      # [D]
bind-key C-p previous-window      # [D]
bind-key C-n next-window          # [D]
# tmux-sensible's real binding sources /etc/tmux.conf and ~/.tmux.conf via
# run-shell with stderr discarded, so under home-manager it is a silent no-op
# here. Pointed at the path this repo actually creates instead, with -q so a
# missing file stays quiet rather than aborting the command sequence.
bind-key R source-file -q "$HOME/.config/tmux/tmux.conf" \; display-message "sourced"  # [D]

# ---- programs.tmux options (expanded from Nix) ---------------------------
set  -g base-index 1                       # [V] baseIndex = 1
setw -g pane-base-index 1                  # [V] baseIndex = 1 (panes follow)
set  -g clock-mode-style 24                # [V] clock24 = true
set  -g focus-events on                    # [V] focusEvents = true
set  -g mode-keys vi                       # [V] keyMode = "vi"
set  -g status-keys vi                     # [V] keyMode = "vi"
set  -g mouse on                           # [V] mouse = true
set  -g default-terminal "screen-256color" # [V] terminal = "screen-256color"

# NOTE: no `prefix` is ever set in his config, so the tmux default C-b stands.

# ---- extraConfig ---------------------------------------------------------
# `renumber-windows` lives here rather than above: home-manager's programs.tmux
# has no renumberWindows option, so it can only have come from extraConfig.
set -g renumber-windows on                # [V]
set -g escape-time 10                     # [V] supersedes tmux-sensible's 0, which is why that is not emitted above
set -g extended-keys on                   # [V]
set -g extended-keys-format csi-u         # [V]
set -g status-position top                # [V]
set -g pane-border-lines heavy            # [V]

# Let the rose-pine theme own pane colouring instead of tmux.
setw -gu window-style                     # [V]
setw -gu window-active-style              # [V]

# Pane navigation, vim keys, -r so they repeat without re-pressing the prefix.
bind-key -r h select-pane -L              # [V]
bind-key -r j select-pane -D              # [V]
bind-key -r k select-pane -U              # [V]
bind-key -r l select-pane -R              # [V]

# Splits and new windows inherit the current pane's directory.
bind-key '"' split-window -c "#{pane_current_path}"      # [V]
bind-key %   split-window -h -c "#{pane_current_path}"   # [V]
bind-key c   new-window -c "#{pane_current_path}"        # [V]
bind-key &   kill-window                                 # [V]

# Copy mode, vi-style.
bind-key y copy-mode                                                        # [V]
bind-key -T copy-mode-vi v      send-keys -X begin-selection                # [V]
bind-key -T copy-mode-vi y      send-keys -X copy-pipe-and-cancel "pbcopy"  # [R]
bind-key -T copy-mode-vi Enter  send-keys -X copy-pipe-and-cancel "pbcopy"  # [R]
bind-key -T copy-mode-vi Escape send-keys -X cancel                         # [V]

# ---- theme: rose-pine moon, matching WezTerm and Neovim ------------------
# The directive itself is [V] - the frame at 6:57 shows
# `set-environment -g TMUX_PLUGIN_MANAGER_PATH "${con` before his pane cuts
# it off. Only the value is [R]: his was a Nix interpolation (`${config...}`)
# that cannot be recovered. TPM's own default is used instead, which is where
# the run-shell below and bootstrap.sh both look, so the two agree. Setting it
# explicitly is a no-op against that default, and is kept only because the
# directive is attested.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"      # [V] directive, [R] value
set -g @rose_pine_variant 'moon'                                        # [V]

# Show the date/time only in the "main" session. The rose-pine date block
# hardcodes an icon/separator around it, so it cannot be made conditional
# cleanly; instead disable it and re-add it through the status-right
# prepend, wrapped in a session-name conditional.
set -g @rose_pine_date_time ""                                          # [V]
set -g @rose_pine_status_right_prepend_section '#{?#{==:#{session_name},main}, %Y-%m-%d %H:%M ,}'  # [R]
set -g @rose_pine_directory 'on'                                        # [V]
set -g @rose_pine_bar_bg_disable 'on'                                   # [V]
set -g @rose_pine_bar_bg_disabled_color_option 'default'                # [V]
set -g @rose_pine_disable_active_window_menu 'on'                       # [V]
set -g @rose_pine_show_current_program 'on'                             # [V]

# ---- plugins -------------------------------------------------------------
set -g @plugin 'rose-pine/tmux'                   # [V]
set -g @plugin 'tmux-plugins/tmux-resurrect'      # [V]
set -g @plugin 'tmux-plugins/tmux-continuum'      # [V]
set -g @resurrect-capture-pane-contents 'on'      # [V]
set -g @continuum-restore 'on'                    # [V]
set -g @continuum-save-interval '15'              # [V]

# ---- load plugins, THEN override their status bar ------------------------
# Order matters and is his, not the usual "TPM goes last" advice: in the video
# run-shell sits above the status lines below, so these overrides win over
# whatever rose-pine sets. Moving TPM last silently hands the status bar back
# to the theme and `status` reverts from 2 to on.
run-shell "$HOME/.tmux/plugins/tpm/tpm"                                 # [V]

set  -g status-left ""                                                  # [V]
# These two formats replace rose-pine's wholesale, so they must carry
# `#{pane_current_command}` themselves - it is the only thing that gives
# `@rose_pine_show_current_program 'on'` above any effect. No `range=` menu
# spec, which is what `@rose_pine_disable_active_window_menu 'on'` asks for.
# `#W` is deliberately absent: `automatic-rename` is on by default, so it
# already resolves to the current command and would render it twice.
setw -g window-status-format "#[fg=#908caa,bg=default] #I #{pane_current_command} "              # [R]
setw -g window-status-current-format "#[fg=#232136,bg=#c4a7e7,bold] #I #{pane_current_command} " # [R]
setw -g window-status-separator " "                                     # [V]
set  -g status 2                                                        # [V]
# fg is `subtle` (#908caa), not `overlay` (#393552): overlay is a background
# shade and renders at 1.34:1 on the moon base, i.e. invisible.
set  -g status-format[1] "#[fg=#908caa,bg=default]#[align=left] #{pane_current_path} " # [R]
